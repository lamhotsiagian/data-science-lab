[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "data-science-lab"
version = "1.0.0"
description = "Master Data Science Curriculum - Complete Lab Implementations"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    # Core Scientific Computing
    "numpy>=1.24",
    "pandas>=2.0",
    "polars>=0.20",
    "pyarrow>=12.0",
    "scipy>=1.10",

    # Machine Learning
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "xgboost>=2.0",
    # Required by ch04 lab1 (TargetEncoder); previously imported but undeclared.
    "category_encoders>=2.6",
    "joblib>=1.3",

    # Visualization
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "plotly>=5.15",
    "altair>=5.0",

    # NLP
    "nltk>=3.8",
    "gensim>=4.3",

    # Deep Learning
    "torch>=2.0",

    # Web & Deployment
    "streamlit>=1.25",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "httpx>=0.24",

    # Utilities
    "pyyaml>=6.0",
    "jupyter>=1.0",
    "nbformat>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore::FutureWarning",
]
